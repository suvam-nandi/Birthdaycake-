<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adrit's Cake Shop - Online Order</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="card-container">
    <!-- Hero Image & Shop Header -->
    <div class="card-header">
      <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=800&q=80" alt="Delicious Chocolate Cake" class="cake-image">
      <div class="header-overlay">
        <h1>Adrit's Cake Shop</h1>
        <p>Freshly Baked Delicious Cakes for Every Occasion</p>
      </div>
    </div>

    <!-- Order Form -->
    <div class="card-body">
      <h2>Place Your Order</h2>
      <form id="orderForm">
        <div class="form-group">
          <label for="customer_name">Customer Name</label>
          <input type="text" id="customer_name" required placeholder="Enter full name">
        </div>

        <div class="form-group">
          <label for="customer_phone">Phone Number</label>
          <input type="tel" id="customer_phone" required placeholder="Enter 10-digit phone number">
        </div>

        <div class="form-group">
          <label for="customer_address">Delivery Address</label>
          <textarea id="customer_address" required placeholder="House no, Street name, Area, City"></textarea>
        </div>

        <div class="form-group">
          <label for="total_amount">Total Amount (₹)</label>
          <input type="number" id="total_amount" required placeholder="e.g. 650">
        </div>

        <button type="submit" id="submitBtn">Confirm Order</button>
      </form>

      <div id="statusMessage"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
